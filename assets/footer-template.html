<!doctype html>
<html lang="en">
	<body>
		<style>
			.footer-container {
				--color: rgb(76 60 25);

				display: flex;
				flex-wrap: wrap;
				align-items: center;
				justify-content: space-between;
				width: 100%;
				margin-inline: 1.5cm 1cm;
				padding-block: 0.25cm 0.5cm;
				border-block-start: 1px solid var(--color);
				font-family: Arial, Helvetica, sans-serif;
				font-size: 10px;
				color: var(--color);
			}

			.link {
				text-decoration: underline;
				text-underline-position: under;
			}
		</style>

		<div class="footer-container">
			<span class="link">https://spectrum.snipshot.dev</span>
			<div>
				<!-- Numbers inside the elements with `.pageNumber` and `.totalPages` classes are injected automatically by Puppeteer -->
				<span class="pageNumber"></span> / <span class="totalPages"></span>
			</div>
		</div>
	</body>
</html>
