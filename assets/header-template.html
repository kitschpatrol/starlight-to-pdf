<!doctype html>
<html lang="en">
	<body>
		<style>
			.header-container {
				--color: rgb(76 60 25);

				display: flex;
				flex-wrap: wrap;
				align-items: center;
				justify-content: space-between;
				width: 100%;
				margin-inline: 1.5cm 1cm;
				padding-block: 0.25cm 0.5cm;
				border-block-end: 1px solid var(--color);
				font-family: Arial, Helvetica, sans-serif;
				font-size: 10px;
				color: var(--color);
			}
		</style>

		<div class="header-container">
			<div>Spectrum library documentation</div>
			<!-- Date inside the element with `.date` class is injected automatically by Puppeteer -->
			<div class="date"></div>
		</div>
	</body>
</html>
